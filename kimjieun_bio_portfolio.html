    function useRevealOnScroll(){
      const rootRef = useRef(null);
      useEffect(() => {
        const root = rootRef.current;
        if(!root) return;

        const obs = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if(entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        const targets = root.querySelectorAll('.reveal');
        targets.forEach(t => obs.observe(t));
        return () => obs.disconnect();
      }, []);
      return rootRef;
    }

      if(!open) return null;

          role="dialog"

            <section id="contact" className="relative">
              <div className="network-bg" style="background-color:#051C2C;">
                <div className="absolute inset-0 opacity-70 pointer-events-none">
                  <div className="absolute inset-0 bg-gradient-to-b from-[#051C2C] via-[#051C2C] to-black/10"></div>
                </div>

                <div className="relative max-w-6xl mx-auto px-4 md:px-6 py-16 md:py-20 text-white">
                  <div className="reveal">
                    <div className="mb-8 md:mb-10">
                      <div className="flex items-center gap-3 mb-3">
                        <span className="inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold bg-white/10 text-cyan-200 border border-white/15">연락처 & 협업</span>
                      </div>
                      <h2 className="text-2xl md:text-3xl font-extrabold tracking-tight text-white">함께 연구하고 싶다면 연락 주세요</h2>
                      <p className="mt-3 text-white/70 text-lg leading-relaxed">이메일/프로필/학술 링크와 CV 다운로드 경로를 한 화면에서 제공합니다.</p>
                    </div>
                  </div>

                  <div className="mt-8 grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-5">
                    {[
                      { title: '이메일 문의', desc: '빠른 회신을 위한 문의 템플릿 제공', value: 'jieun.kim@example.com', href: 'mailto:jieun.kim@example.com', icon: 'mail' },
                      { title: 'LinkedIn 프로필', desc: '학력/경력 요약과 프로젝트 흐름', value: 'linkedin.com/in/kimjieun', href: 'https://www.linkedin.com/', icon: 'linkedin' },
                      { title: 'Google Scholar', desc: '논문/발표를 한 곳에서', value: 'scholar.google.com (예시)', href: 'https://scholar.google.com/', icon: 'book-search' },
                    ].map((c, idx) => (
                      <a key={idx} href={c.href} target={c.href.startsWith('http') ? '_blank' : undefined} rel={c.href.startsWith('http') ? 'noreferrer' : undefined}
                        className="reveal rounded-3xl bg-white/5 border border-white/10 p-6 hover:bg-white/8 transition">
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <div className="text-white/70 text-xs font-bold tracking-wide">CONTACT</div>
                            <div className="mt-2 font-extrabold text-white text-lg">{c.title}</div>
                            <div className="mt-2 text-white/70 text-sm leading-relaxed">{c.desc}</div>
                          </div>
                          <div className="w-12 h-12 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center">
                            <i data-lucide={c.icon} className="w-6 h-6 text-cyan-300" />
                          </div>
                        </div>
                        <div className="mt-4 rounded-2xl bg-black/20 border border-white/10 px-4 py-3 text-sm font-bold text-white/90 truncate">{c.value}</div>
                      </a>
                    ))}
                  </div>

                  <div className="mt-8">
                    <div className="reveal rounded-3xl bg-white/5 border border-white/10 p-6">
                      <div className="flex items-center justify-between gap-4 flex-wrap">
                        <div>
                          <div className="text-white/70 text-xs font-bold tracking-wide">DOWNLOAD</div>
                          <div className="mt-2 font-extrabold text-white text-lg">CV & 이력서 다운로드</div>
                          <div className="mt-2 text-white/70 text-sm leading-relaxed">버튼 클릭 시 브라우저에서 바로 다운로드됩니다.</div>
                        </div>
                        <div className="hidden md:flex items-center gap-2 text-white/70 text-sm">
                          <i data-lucide="sparkles" className="w-4 h-4 text-cyan-300" />
                          <span>Premium glow</span>
                        </div>
                      </div>

                      <div className="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <a href={cvHref} download="KimJieun_CV.pdf" className="btn-glow btn-shimmer relative col-span-1 rounded-2xl overflow-hidden border border-white/15 bg-white/10 hover:bg-white/15 transition">
                          <div className="px-5 py-4 relative z-10 flex items-center justify-center gap-2 font-extrabold">
                            <i data-lucide="download" className="w-5 h-5 text-cyan-200" /> <span>CV 다운로드</span>
                          </div>
                        </a>
                        <a href={resumeHref} download="KimJieun_Resume.pdf" className="btn-glow btn-shimmer relative col-span-1 rounded-2xl overflow-hidden border border-white/15 bg-white/10 hover:bg-white/15 transition">
                          <div className="px-5 py-4 relative z-10 flex items-center justify-center gap-2 font-extrabold">
                            <i data-lucide="download" className="w-5 h-5 text-cyan-200" /> <span>이력서 다운로드</span>
                          </div>
                        </a>
                        <div className="hidden sm:block rounded-2xl border border-white/10 bg-white/5 p-4">
                          <div className="text-white/70 text-xs font-bold tracking-wide">TIP</div>
                          <div className="mt-2 text-sm text-white/80 leading-relaxed">지원 시<br/>“연구 프로젝트” 섹션을 함께 확인해 주세요.</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <footer className="border-t border-slate-200 bg-white">
              <div className="max-w-6xl mx-auto px-4 md:px-6 py-10 flex items-center justify-between gap-4 flex-wrap">
                <div className="text-slate-600 text-sm">© {new Date().getFullYear()} 김지은 · 최종 업데이트: <span className="font-bold text-slate-800">2026-07</span></div>
                <button type="button" onClick={() => scrollToId('top')} className="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 px-4 py-2.5 font-bold text-slate-900 transition">
                  <i data-lucide="arrow-up" className="w-4 h-4 text-sky-700" /> <span>맨 위로 이동</span>
                </button>
              </div>
            </footer>
          </main>

          <Modal open={!!skillModal} title={skillModal ? skillModal.title : ''} onClose={() => setSkillModal(null)}>
            {skillModal ? (
              <div>
                <div className="text-slate-600 text-sm leading-relaxed">{skillModal.desc}</div>

                <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                    <div className="font-extrabold text-slate-900">핵심 포인트</div>
                    <ul className="mt-3 space-y-2">
                      {skillModal.details.map((d, i) => (
                        <li key={i} className="flex items-start gap-2 text-slate-700">
                          <span className="mt-2 w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_16px_rgba(0,169,224,0.35)]"></span>
                          <span className="text-sm leading-relaxed">{d}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div className="rounded-2xl border border-slate-200 bg-white p-4">
                    <div className="font-extrabold text-slate-900">기술 태그</div>
                    <div className="mt-3 grid grid-cols-2 gap-2">
                      {skillModal.tags.map((t, idx) => (
                        <div key={idx} className="text-xs rounded-xl border border-slate-200 bg-white px-2 py-1.5 text-slate-700 truncate">{t}</div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="mt-5 flex items-center justify-end gap-3">
                  <button type="button" onClick={() => setSkillModal(null)} className="rounded-2xl px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold">닫기</button>
                </div>
              </div>
            ) : null}
          </Modal>

          <Modal open={!!projectModal} title={projectModal ? projectModal.title : ''} onClose={() => setProjectModal(null)}>
            {projectModal ? (
              <div>
                <div className="flex flex-wrap gap-2 mb-4">
                  {(projectModal.typeTags || []).map((t, idx) => (
                    <span key={idx} className="text-xs rounded-full border border-slate-200 bg-white px-3 py-1.5 text-slate-700 font-bold">{t}</span>
                  ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                    <div className="font-extrabold text-slate-900">배경</div>
                    <div className="mt-2 text-slate-700 text-sm leading-relaxed">{projectModal.background}</div>
                  </div>
                  <div className="rounded-2xl border border-slate-200 bg-white p-4">
                    <div className="font-extrabold text-slate-900">목적</div>
                    <div className="mt-2 text-slate-700 text-sm leading-relaxed">{projectModal.objective}</div>
                  </div>
                </div>

                <div className="mt-4 rounded-2xl border border-slate-200 bg-white p-4">
                  <div className="font-extrabold text-slate-900">방법론 (Methodology)</div>
                  <ul className="mt-3 space-y-2">
                    {projectModal.methodology.map((m, i) => (
                      <li key={i} className="flex items-start gap-2 text-slate-700">
                        <span className="mt-2 w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_16px_rgba(0,169,224,0.35)]"></span>
                        <span className="text-sm leading-relaxed">{m}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="mt-4 rounded-2xl border border-slate-200 bg-slate-50 p-4">
                  <div className="font-extrabold text-slate-900">결과 (Results)</div>
                  <ul className="mt-3 space-y-2">
                    {projectModal.results.map((r, i) => (
                      <li key={i} className="flex items-start gap-2 text-slate-700">
                        <span className="mt-2 w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_16px_rgba(0,169,224,0.35)]"></span>
                        <span className="text-sm leading-relaxed">{r}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="mt-4 rounded-2xl border border-slate-200 bg-white p-4">
                  <div className="font-extrabold text-slate-900">성과 (Achievements)</div>
                  <ul className="mt-3 space-y-2">
                    {projectModal.achievements.map((a, i) => (
                      <li key={i} className="flex items-start gap-2 text-slate-700">
                        <span className="mt-2 w-1.5 h-1.5 rounded-full bg-cyan-500 shadow-[0_0_16px_rgba(0,169,224,0.35)]"></span>
                        <span className="text-sm leading-relaxed">{a}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="mt-4 rounded-2xl border border-slate-200 bg-slate-50 p-4">
                  <div className="font-extrabold text-slate-900">사용 스택</div>
                  <div className="mt-3 flex flex-wrap gap-2">
                    {(projectModal.stack||[]).map((st, idx) => (
                      <span key={idx} className="text-xs rounded-full border border-slate-200 bg-white px-3 py-1.5 text-slate-700 font-bold">{st}</span>
                    ))}
                  </div>
                </div>

                <div className="mt-5 flex items-center justify-end gap-3">
                  <button type="button" onClick={() => setProjectModal(null)} className="rounded-2xl px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold">닫기</button>
                </div>
              </div>
            ) : null}
          </Modal>
        </div>
      );
    };

    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
